<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИСП-24 | Расписание</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { min-height: 100vh; background: #0b1120; color: #e2e8f0; overflow-x: hidden; }
        
        /* Loader */
        #loader { position: fixed; inset: 0; z-index: 100; background: #0b1120; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease, visibility 0.8s ease; }
        #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-spinner { width: 50px; height: 50px; border: 4px solid rgba(139, 92, 246, 0.2); border-top-color: #8b5cf6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
        .loader-text { font-size: 1.5rem; font-weight: 700; background: linear-gradient(90deg, #8b5cf6, #3b82f6, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: pulse 2s infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* Glassmorphism & UI */
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        .day-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .day-btn:hover { transform: translateY(-2px); background: rgba(30, 41, 59, 0.8); }
        .day-btn.active { transform: scale(1.05); box-shadow: 0 0 20px var(--btn-glow); border-color: transparent; background: rgba(30, 41, 59, 0.9); }
        
        .schedule-card { animation: slideUp 0.4s ease forwards; opacity: 0; transform: translateY(20px); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        
        .toggle-switch { width: 48px; height: 26px; background: #334155; border-radius: 13px; position: relative; cursor: pointer; transition: background 0.3s; }
        .toggle-switch.active { background: #8b5cf6; }
        .toggle-thumb { width: 20px; height: 20px; background: #fff; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .toggle-switch.active .toggle-thumb { transform: translateX(22px); }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
        .badge-constant { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-numerator { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-denominator { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.3); }
        .badge-alternating { background: rgba(236, 72, 153, 0.15); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }
        .badge-none { background: rgba(107, 114, 128, 0.15); color: #9ca3af; border: 1px solid rgba(107, 114, 128, 0.3); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b1120; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        
        .gradient-text { background: linear-gradient(90deg, #8b5cf6, #3b82f6, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    </style>
</head>
<body>
    <div id="loader"><div class="loader-spinner"></div><div class="loader-text">ИСП-24</div></div>
    
    <div class="p-4 md:p-8 max-w-6xl mx-auto opacity-0 transition-opacity duration-700" id="app">
        <!-- Header -->
        <header class="glass rounded-3xl p-6 mb-6 flex flex-col md:flex-row items-center justify-between gap-4 shadow-lg shadow-purple-900/20">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-violet-500/30">
                    <i class="fa-solid fa-graduation-cap text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold gradient-text">ИСП-24</h1>
                    <p class="text-slate-400 text-sm">Расписание занятий</p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-6 justify-center">
                <div class="flex items-center gap-3 bg-slate-800/50 px-4 py-2 rounded-2xl border border-slate-700/50">
                    <span class="text-sm font-medium text-slate-300">Числитель</span>
                    <div class="toggle-switch" id="weekToggle"><div class="toggle-thumb"></div></div>
                    <span class="text-sm font-medium text-slate-500">Знаменатель</span>
                </div>
                <button id="allDaysBtn" class="px-4 py-2 rounded-xl bg-slate-800/50 text-slate-300 hover:bg-slate-700/50 transition border border-slate-700/50 text-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-grid-2"></i> Все дни
                </button>
            </div>
        </header>

        <!-- Day Selector -->
        <nav id="daysNav" class="glass rounded-3xl p-4 mb-6 grid grid-cols-3 sm:grid-cols-6 gap-3">
            <!-- Buttons injected by JS -->
        </nav>

        <!-- Schedule -->
        <main id="scheduleContainer" class="min-h-[300px]"></main>
    </div>

    <script>
        const scheduleData = {
            monday: [
                { time: "8:30–10:00", type: "constant", subject: "МДК 01.04", cabinet: "501" },
                { time: "10:15–11:00", type: "constant", subject: "Классный час", cabinet: "552" },
                { time: "11:10–12:40", type: "constant", subject: "МДК 01.01", cabinet: "501" },
                { time: "13:10–14:40", type: "numerator", subject: "ОАиП", cabinet: "501" }
            ],
            tuesday: [
                { time: "8:30–10:00", type: "constant", subject: "Числ. методы", cabinet: "540" },
                { time: "10:15–11:45", type: "constant", subject: "ОСиС", cabinet: "529" },
                { time: "12:15–13:45", type: "constant", subject: "Выш. мат.", cabinet: "357" },
                { time: "13:55–15:35", type: "none", subject: "—", cabinet: "" }
            ],
            wednesday: [
                { time: "8:30–10:00", type: "constant", subject: "Английский язык", cabinet: "2 корпус №25/27" },
                { time: "10:15–11:45", type: "constant", subject: "МДК 04.01", cabinet: "563" },
                { time: "12:15–13:45", type: "constant", subject: "МДК 04.02", cabinet: "552" },
                { time: "13:55–15:25", type: "denominator", subject: "МДК 02.02", cabinet: "516" }
            ],
            thursday: [
                { time: "8:30–10:00", type: "constant", subject: "Дис. мат.", cabinet: "357" },
                { time: "10:15–11:45", type: "constant", subject: "Физкультура", cabinet: "" },
                { time: "12:15–13:45", type: "constant", subject: "ОАиП", cabinet: "501" },
                { time: "13:55–15:25", type: "none", subject: "—", cabinet: "" }
            ],
            friday: [
                { time: "8:30–10:00", type: "constant", subject: "МДК 04.01", cabinet: "563" },
                { time: "10:15–11:45", type: "constant", subject: "Дис. мат.", cabinet: "357" },
                { time: "12:15–13:45", type: "alternating", subjectNumerator: "МДК 01.04", subjectDenominator: "МДК 01.01", cabinet: "501" }
            ],
            saturday: [
                { time: "8:30–10:00", type: "constant", subject: "МДК 07.01", cabinet: "516" },
                { time: "10:15–11:45", type: "constant", subject: "МДК 07.01", cabinet: "516" },
                { time: "12:00–13:30", type: "constant", subject: "МДК 02.02", cabinet: "516" }
            ]
        };

        const daysConfig = [
            { id: 'monday', name: 'Понедельник', icon: 'fa-sun', color: 'from-orange-400 to-orange-500', glow: 'rgba(249, 115, 22, 0.5)' },
            { id: 'tuesday', name: 'Вторник', icon: 'fa-cloud', color: 'from-blue-400 to-blue-500', glow: 'rgba(59, 130, 246, 0.5)' },
            { id: 'wednesday', name: 'Среда', icon: 'fa-cloud-rain', color: 'from-cyan-400 to-cyan-500', glow: 'rgba(6, 182, 212, 0.5)' },
            { id: 'thursday', name: 'Четверг', icon: 'fa-wind', color: 'from-emerald-400 to-emerald-500', glow: 'rgba(16, 185, 129, 0.5)' },
            { id: 'friday', name: 'Пятница', icon: 'fa-umbrella', color: 'from-indigo-400 to-indigo-500', glow: 'rgba(99, 102, 241, 0.5)' },
            { id: 'saturday', name: 'Суббота', icon: 'fa-crown', color: 'from-purple-400 to-purple-500', glow: 'rgba(168, 85, 247, 0.5)' }
        ];

        let isNumerator = true;
        let currentDay = 'monday';
        let showAllDays = false;

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('app').classList.remove('opacity-0');
                document.getElementById('weekToggle').classList.add('active');
                renderDays();
                renderSchedule();
            }, 1500);
        });

        function renderDays() {
            const nav = document.getElementById('daysNav');
            nav.innerHTML = daysConfig.map(day => `
                <button class="day-btn glass rounded-2xl py-3 flex flex-col items-center gap-2 cursor-pointer ${day.id === currentDay ? 'active' : ''}" 
                        data-day="${day.id}" style="--btn-glow: ${day.glow}">
                    <i class="fa-solid ${day.icon} text-xl text-slate-400 group-hover:text-white transition-colors"></i>
                    <span class="text-xs font-semibold text-slate-300">${day.name.slice(0, 2)}</span>
                </button>
            `).join('');

            nav.querySelectorAll('.day-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (showAllDays) return;
                    nav.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentDay = btn.dataset.day;
                    renderSchedule();
                });
            });
        }

        function getSubject(lesson) {
            if (lesson.type === 'alternating') return isNumerator ? lesson.subjectNumerator : lesson.subjectDenominator;
            return lesson.subject;
        }

        function getBadge(type) {
            const map = {
                'constant': { cls: 'badge-constant', text: 'Постоянно' },
                'numerator': { cls: 'badge-numerator', text: 'Числитель' },
                'denominator': { cls: 'badge-denominator', text: 'Знаменатель' },
                'alternating': { cls: 'badge-alternating', text: isNumerator ? 'Числитель' : 'Знаменатель' },
                'none': { cls: 'badge-none', text: 'Окно' }
            };
            return map[type] || map['constant'];
        }

        function renderSchedule() {
            const container = document.getElementById('scheduleContainer');
            container.style.opacity = '0';
            
            setTimeout(() => {
                let html = '';
                const daysToShow = showAllDays ? daysConfig : daysConfig.filter(d => d.id === currentDay);

                if (showAllDays) {
                    html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-6">';
                }

                daysToShow.forEach(day => {
                    let lessons = scheduleData[day.id] || [];
                    
                    // Фильтрация: скрываем пары знаменателя в режиме числителя и наоборот
                    lessons = lessons.filter(l => {
                        if (l.type === 'numerator') return isNumerator;
                        if (l.type === 'denominator') return !isNumerator;
                        return true;
                    });

                    const dayHeader = `
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${day.color} flex items-center justify-center shadow-lg shadow-${day.color.split(' ')[1].replace('to-','')}/30">
                                <i class="fa-solid ${day.icon} text-white text-sm"></i>
                            </div>
                            <h2 class="text-xl font-bold text-white">${day.name}</h2>
                        </div>
                    `;

                    let lessonsHtml = '';
                    if (lessons.length === 0) {
                        lessonsHtml = `<div class="glass rounded-2xl p-6 text-center text-slate-500">Нет занятий</div>`;
                    } else {
                        lessonsHtml = lessons.map((l, i) => {
                            const subject = getSubject(l);
                            const badge = getBadge(l.type);
                            return `
                                <div class="schedule-card glass rounded-2xl p-5 hover:bg-slate-800/40 transition-colors" style="animation-delay: ${i * 80}ms">
                                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                        <div class="flex-1 min-w-0">
                                            <div class="flex items-center gap-3 mb-2">
                                                <span class="text-2xl font-bold gradient-text">${l.time}</span>
                                                <span class="badge ${badge.cls}">${badge.text}</span>
                                            </div>
                                            <h3 class="text-lg font-semibold text-white truncate mb-1">${subject}</h3>
                                            <div class="flex items-center gap-4 text-sm text-slate-400">
                                                <span><i class="fa-solid fa-location-dot mr-1 text-slate-500"></i>Каб. ${l.cabinet || '—'}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    }

                    html += showAllDays 
                        ? `<div class="glass rounded-3xl p-6">${dayHeader}<div class="space-y-3">${lessonsHtml}</div></div>`
                        : dayHeader + `<div class="space-y-3">${lessonsHtml}</div>`;
                });

                if (showAllDays) html += '</div>';
                container.innerHTML = html;
                
                requestAnimationFrame(() => { container.style.opacity = '1'; });
            }, 200);
        }

        document.getElementById('weekToggle').addEventListener('click', function() {
            this.classList.toggle('active');
            isNumerator = !isNumerator;
            renderSchedule();
        });

        document.getElementById('allDaysBtn').addEventListener('click', function() {
            showAllDays = !showAllDays;
            this.classList.toggle('bg-violet-600/30', showAllDays);
            this.classList.toggle('border-violet-500/50', showAllDays);
            this.innerHTML = showAllDays ? '<i class="fa-solid fa-calendar-day"></i> Один день' : '<i class="fa-solid fa-grid-2"></i> Все дни';
            document.getElementById('daysNav').style.display = showAllDays ? 'none' : 'grid';
            renderSchedule();
        });
    </script>
</body>
</html>
